<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>IDC3 Phase 1 Face Rack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg1:#07102a;--bg2:#12306b;--glow1:rgba(70,120,255,.38);--glow2:rgba(120,90,255,.28);
 --ink:#eaf1ff;--mut:#94a6cc;--line:rgba(255,255,255,.13);--hi:rgba(255,255,255,.14);
 --card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.035);--cardsolid:#13224a;
 --dual:#7aa8ff;--dualbg:rgba(88,138,255,.22);--sg:#e8c766;--sgbg:rgba(232,199,102,.17);--emp:rgba(255,255,255,.1);
 --hdbg:rgba(9,18,46,.62);--navbg:rgba(14,26,62,.72);--sh:rgba(0,6,28,.6);--dvb:rgba(8,16,42,.55);--grid:rgba(255,255,255,.07);--gr:#4cd6a0;--grf:rgba(76,214,160,.5);--grbg:rgba(76,214,160,.15);--yl:#e8c766;--ylf:rgba(232,199,102,.5);--ylbg:rgba(232,199,102,.14);--rd:#f2727b;--rdf:rgba(242,114,123,.55);--rdbg:rgba(242,114,123,.16)}
@media(prefers-color-scheme:light){:root{
 --bg1:#e6edff;--bg2:#c9d9ff;--glow1:rgba(90,140,255,.35);--glow2:rgba(170,140,255,.28);
 --ink:#14213d;--mut:#5b6c91;--line:rgba(40,70,140,.14);--hi:rgba(255,255,255,.9);
 --card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.5);--cardsolid:#fff;
 --dual:#2f63d9;--dualbg:rgba(60,110,230,.15);--sg:#a97c0c;--sgbg:rgba(201,160,50,.2);--emp:rgba(40,70,140,.1);
 --hdbg:rgba(236,242,255,.72);--navbg:rgba(255,255,255,.8);--sh:rgba(40,70,150,.28);--dvb:rgba(255,255,255,.7);--grid:rgba(40,70,140,.1);--gr:#17956a;--grf:rgba(23,149,106,.5);--grbg:rgba(23,149,106,.12);--yl:#a97c0c;--ylf:rgba(169,124,12,.5);--ylbg:rgba(201,160,50,.18);--rd:#d03f4b;--rdf:rgba(208,63,75,.5);--rdbg:rgba(208,63,75,.12)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg1);overflow-x:hidden;overflow-x:clip;max-width:100%;overscroll-behavior-x:none;touch-action:manipulation}
body{font:15px/1.45 "IBM Plex Sans Thai",system-ui,sans-serif;color:var(--ink);min-height:100vh;width:100%;max-width:100vw;overflow-x:hidden;overflow-x:clip;touch-action:manipulation;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(520px 420px at 85% -5%,var(--glow1),transparent 70%),radial-gradient(480px 460px at -10% 40%,var(--glow2),transparent 70%),radial-gradient(600px 500px at 90% 105%,var(--glow1),transparent 70%),linear-gradient(180deg,var(--bg2),var(--bg1) 70%)}
a{color:inherit;text-decoration:none}
/* ---------- header ---------- */
header{position:sticky;top:0;z-index:10;background:var(--hdbg);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--line);box-shadow:0 10px 30px -14px var(--sh),inset 0 -1px 0 var(--hi);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px}
header h1{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;margin-bottom:9px;letter-spacing:.2px}
header h1 span{color:var(--mut);font-weight:400}
header h1 i{width:26px;height:26px;border-radius:9px;flex:none;background:linear-gradient(150deg,#79a8ff,#2f5fdc);box-shadow:0 6px 14px -3px rgba(60,110,255,.7),inset 0 1px 0 rgba(255,255,255,.45);display:grid;place-items:center}
header h1 i svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#q{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--card2),var(--card));color:var(--ink);outline:0;box-shadow:inset 0 2px 6px rgba(0,0,0,.18),0 1px 0 var(--hi);transition:box-shadow .25s,border-color .25s}
#q::placeholder{color:var(--mut)}
#q:focus{border-color:var(--dual);box-shadow:inset 0 2px 6px rgba(0,0,0,.18),0 0 0 3px var(--dualbg)}
main{padding:14px 14px;max-width:760px;margin:0 auto;overflow-x:clip;will-change:transform,opacity}
/* ---------- bottom nav ---------- */
nav{position:relative;margin-top:10px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);padding:5px;border-radius:22px;background:var(--navbg);border:1px solid var(--line);box-shadow:0 10px 22px -10px var(--sh),inset 0 1px 0 var(--hi)}
nav .ind{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:18px;background:linear-gradient(160deg,#6c9fff,#2f5fdc);box-shadow:0 10px 22px -4px rgba(60,110,255,.75),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 4px rgba(0,0,40,.25);transform:translateX(calc(var(--k,0)*100%));transition:transform .5s cubic-bezier(.3,1.35,.45,1),opacity .3s}
nav a{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;font-size:11.5px;font-weight:500;color:var(--mut);transition:color .3s,transform .15s}
nav a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
nav a.on{color:#fff}nav a.on svg{transform:translateY(-1px) scale(1.12)}
nav a:active{transform:scale(.94)}
nav a{-webkit-user-select:none;user-select:none;touch-action:manipulation}
/* ---------- page transitions ---------- */
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
main.pg-r{animation:inR .42s cubic-bezier(.2,.85,.25,1)}main.pg-l{animation:inL .42s cubic-bezier(.2,.85,.25,1)}main.pg-u{animation:inU .38s cubic-bezier(.2,.85,.25,1)}
main.pg-go .cb,main.pg-go .rc,main.pg-go .rb,main.pg-go .dr,main.pg-go .lg,main.pg-go .box,main.pg-go .kpi>div,main.pg-go .ug a,main.pg-go .el,main.pg-go .rowh,main.pg-go .tiles,main.pg-go .gh{animation:pop .5s cubic-bezier(.2,.85,.25,1) both;animation-delay:calc(var(--i,0)*38ms)}
@media(prefers-reduced-motion:reduce){main,main *,nav .ind{animation:none!important;transition:none!important}}
/* ---------- type ---------- */
h2{font-size:16px;font-weight:600;margin:20px 0 9px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,#79a8ff,#2f5fdc);box-shadow:0 0 10px rgba(80,130,255,.7)}
main>h2:first-child,main>a.back+h2{margin-top:4px}
.sub{color:var(--mut);font-size:13px}
.back{display:inline-flex;align-items:center;padding:7px 14px 7px 10px;margin-bottom:6px;border-radius:99px;color:var(--dual);font-weight:500;background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);box-shadow:0 6px 14px -6px var(--sh),inset 0 1px 0 var(--hi);transition:transform .15s}
.back:active{transform:scale(.95)}
/* ---------- glass surfaces ---------- */
.kpi div,.lg,.rc,.ug a,.el,.dr,.cb,.rb,#inf{background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--line);box-shadow:0 12px 26px -10px var(--sh),0 2px 4px rgba(0,0,0,.12),inset 0 1px 0 var(--hi)}
.lg,.cb,.el,#inf,.kpi div{backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3)}
a.cb,a.rc,a.rb,.ug a,.lg a{transition:transform .22s cubic-bezier(.3,1.4,.5,1),box-shadow .22s}
a.cb:active,a.rc:active,a.rb:active,.ug a:active{transform:scale(.965)}
@media(hover:hover){a.cb:hover,a.rc:hover,a.rb:hover,.ug a:hover{transform:translateY(-3px);box-shadow:0 18px 32px -10px var(--sh),inset 0 1px 0 var(--hi)}.lg a:hover{background:var(--card)}}
.seg{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg a,.seg select{flex:none;padding:8px 15px;border-radius:99px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--card2));font:inherit;font-size:14px;color:var(--ink);box-shadow:0 5px 12px -6px var(--sh),inset 0 1px 0 var(--hi);transition:transform .15s,box-shadow .25s}
.seg a:active{transform:scale(.94)}
.seg a.on{background:linear-gradient(160deg,#6c9fff,#2f5fdc);color:#fff;border-color:transparent;box-shadow:0 8px 18px -4px rgba(60,110,255,.7),inset 0 1px 0 rgba(255,255,255,.4)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.kpi.k4{grid-template-columns:1fr 1fr}
.kpi div{border-radius:16px;padding:11px 12px}
.kpi b{display:block;font-size:24px;font-weight:600;line-height:1.15}
.kpi small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3;margin-top:1px}
.kpi .tb b,.cb.tb .big{color:var(--dual)}.kpi .ty b,.cb.ty .big{color:var(--yl);text-shadow:0 0 18px var(--ylf)}.kpi .tr b,.cb.tr .big{color:var(--rd);text-shadow:0 0 18px var(--rdf)}.kpi .tg b,.cb.tg .big{color:var(--gr);text-shadow:0 0 18px var(--grf)}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.leg i,.t{display:inline-block;border-radius:5px}
.leg i{width:14px;height:14px;vertical-align:-3px;margin-right:4px}
.rowh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.rowh b{font-size:14.5px}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:46px;gap:6px}
.t{height:46px;min-width:0;width:100%;box-sizing:border-box;align-self:start;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;position:relative;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.t:active{transform:scale(.88)}
@media(hover:hover){.t:hover{transform:translateY(-3px) scale(1.05)}}
.t.g{background:linear-gradient(160deg,#58dbaa,#1f9e72);color:#fff;box-shadow:0 8px 14px -6px rgba(30,170,120,.75),inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 3px rgba(0,50,30,.22)}
.t.y{background:linear-gradient(160deg,#f1d681,#c79f3c);color:#3b2d06;box-shadow:0 8px 14px -6px rgba(200,160,50,.7),inset 0 0 0 1px rgba(255,255,255,.3),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 3px rgba(80,55,0,.2)}
.t.r{background:linear-gradient(160deg,#f68a92,#d6434f);color:#fff;box-shadow:0 8px 14px -6px rgba(220,70,80,.75),inset 0 0 0 1px rgba(255,255,255,.28),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 3px rgba(80,0,10,.22)}
.t.nu{background:var(--dualbg);color:var(--dual);box-shadow:inset 0 0 0 1px var(--line)}
.t.empty{background:var(--emp);color:var(--mut);font-weight:400;box-shadow:inset 0 2px 5px rgba(0,0,0,.2)}
.t.cage{background:repeating-linear-gradient(135deg,var(--emp) 0 4px,transparent 4px 8px);color:var(--mut);border:1px solid var(--line);font-weight:400}
.t.off{background:var(--dualbg);border:2px dashed var(--dual);color:var(--dual)}
.t.by::after{content:"+";position:absolute;top:1px;right:5px;font-size:12px}
.t.p::after{content:"P";position:absolute;top:2px;right:4px;font-size:9px;opacity:.85}
.lg{border-radius:18px;overflow:hidden}
.lg a{display:flex;justify-content:space-between;gap:10px;padding:13px 15px;border-top:1px solid var(--line);transition:background .2s}
.lg a:first-child{border-top:0}.lg a:active{background:var(--card)}
.lg b{font-weight:500}
.bar{height:6px;border-radius:4px;background:rgba(0,0,0,.22);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);margin-top:7px;overflow:hidden}
@media(prefers-color-scheme:light){.bar{background:rgba(40,70,140,.14)}}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#f6e19a,#d2a63c);box-shadow:0 0 10px var(--ylf);transform-origin:left;animation:grow .9s cubic-bezier(.2,.85,.25,1) both .15s}
.rc{display:block;border-radius:16px;padding:12px 14px;margin-bottom:9px}
.rt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--emp);color:var(--ink);white-space:nowrap}
.pill.y{background:var(--ylbg);color:var(--yl);font-weight:600;box-shadow:inset 0 0 0 1px var(--ylf)}.pill.g{background:var(--grbg);color:var(--gr);font-weight:600;box-shadow:inset 0 0 0 1px var(--grf)}.pill.r{background:var(--rdbg);color:var(--rd);font-weight:600;box-shadow:inset 0 0 0 1px var(--rdf)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chips i{font-style:normal;font-size:12px;padding:1px 9px;border-radius:7px;background:var(--emp)}
.chips .cs{background:var(--rdbg);color:var(--rd);font-weight:600}.chips .cd{background:var(--grbg);color:var(--gr);font-weight:600}
.ug{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.ug a{border-radius:16px;padding:12px 6px;text-align:center}
.ug b{display:block;font-size:21px;font-weight:600}.ug u{text-decoration:none;display:block;font-size:12px;color:var(--sg);font-weight:600}
.box{border-radius:16px;padding:12px 14px;margin:12px 0;font-size:14px;border:1px solid var(--line);box-shadow:0 12px 24px -10px var(--sh),inset 0 1px 0 var(--hi)}
.box.y b,.box.r b,.box.g b{font-weight:600}.box p{margin-top:3px;font-size:13px}
.el{display:flex;border-radius:18px;padding:10px 10px 10px 0;margin:12px 0}
.us{width:30px;flex:none;font-size:9.5px;color:var(--mut);text-align:right;padding-right:6px}
.us div,.ub{height:20px}.us div{line-height:20px}
.ub{position:relative;flex:1;background:repeating-linear-gradient(transparent 0 19px,var(--grid) 19px 20px);border-radius:6px}
.dv{position:absolute;left:0;right:0;border-radius:7px;padding:0 8px;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;border:1px solid var(--dvb);display:flex;align-items:center;box-shadow:0 4px 8px -3px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28);transition:filter .2s}
.dv.Dual{background:linear-gradient(160deg,#58dbaa,#1f9e72)}.dv.Single{background:linear-gradient(160deg,#f68a92,#d6434f)}
.dv.x{background:var(--emp);color:var(--mut);box-shadow:none}.dv.off{background:var(--dualbg);color:var(--dual);border:1px dashed var(--dual);box-shadow:none}
.dv.sel{outline:2px solid #fff;box-shadow:0 0 16px rgba(255,255,255,.55);z-index:2}
#inf{position:sticky;top:calc(158px + env(safe-area-inset-top,0px));z-index:3;border-radius:16px;border-color:var(--dual);padding:11px 14px;font-size:13.5px;display:none;animation:inU .3s cubic-bezier(.2,.85,.25,1)}
.dr{border-radius:14px;padding:10px 13px;margin-bottom:8px;font-size:13.5px}
.dr small{color:var(--mut);display:block}
.empty{color:var(--mut);text-align:center;padding:30px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cb{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:94px;border-radius:18px;padding:12px 13px}
.cb>b{font-weight:600;font-size:14.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.cb .big{font-size:29px;line-height:1}
.cb .ln{white-space:nowrap;display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.cb .ln em{font-style:normal;color:var(--sg);font-weight:600}
.rb{display:block;border-left:4px solid var(--emp);border-radius:14px;padding:10px 12px}

.rb b{font-size:14px;word-break:break-all}.rb .chips{margin-top:6px}
.rb .pill{font-size:11px;padding:1px 8px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 9px;gap:8px}
.gh b{font-size:15px}
.ur{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--line);font-size:13.5px}
.ur:first-child{border-top:0}.ur span:first-child{width:62px;font-weight:500}.ur .bar{flex:1;margin:0}.ur span:last-child{width:56px;text-align:right;color:var(--mut);font-size:12.5px}
/* ---------- impact frames ---------- */
.rc.g,.rb.g,.el.g,.cb.g,.box.g{--c:var(--gr);--cf:var(--grf);--cbg:var(--grbg)}
.rc.y,.rb.y,.el.y,.cb.y,.box.y{--c:var(--yl);--cf:var(--ylf);--cbg:var(--ylbg)}
.rc.r,.rb.r,.el.r,.cb.r,.box.r{--c:var(--rd);--cf:var(--rdf);--cbg:var(--rdbg)}
:is(.rc,.rb,.el,.cb,.box):is(.g,.y,.r){border-color:var(--cf);background:linear-gradient(150deg,var(--cbg),var(--card2));box-shadow:0 12px 26px -10px var(--sh),0 0 20px -8px var(--cf),inset 0 1px 0 var(--hi)}
.rb:is(.g,.y,.r){border-left:4px solid var(--c)}
.el:is(.g,.y,.r){box-shadow:0 12px 26px -10px var(--sh),0 0 26px -8px var(--cf),inset 0 0 0 1px var(--cbg),inset 0 1px 0 var(--hi)}
/* ---------- dashboard hero ---------- */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:9px}.g3 .cb{padding:12px 11px;min-height:96px}.g3 .big{font-size:26px}
.cb.hero{grid-column:1/-1;min-height:0;gap:13px;padding:15px 16px}
.hero .hr{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hero .big{display:block;font-size:42px;letter-spacing:-.5px;margin-top:2px}
.hl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut)}.hl b{color:var(--ink);font-weight:600;margin-left:3px}
.hl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.hl .lk{color:var(--mut);transition:color .2s}.hl .lk:active,.hl .lk:hover{color:var(--ink)}
.stk{display:flex;gap:3px;height:13px;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.stk i{display:block;height:100%;min-width:4px;border-radius:3px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.85,.25,1) both .2s}
.k-u{background:linear-gradient(90deg,#7aa9ff,#3566dc)}.k-e{background:var(--mut)}.k-c{background:repeating-linear-gradient(135deg,var(--mut) 0 2px,transparent 2px 4px);border:1px solid var(--mut)}.k-o{background:var(--dualbg);border:1px dashed var(--dual)}

/* ---------- additions: free-rack / risk list / export ---------- */
:root{--mk:#b9a0ff;--mkbg:rgba(185,160,255,.18);--mkf:rgba(185,160,255,.55)}
@media(prefers-color-scheme:light){:root{--mk:#6a3fd0;--mkbg:rgba(120,80,220,.12);--mkf:rgba(106,63,208,.5)}}
a.cb .go{color:var(--dual);font-weight:600}
.rb.mk{border-left-color:var(--mk);border-color:var(--mkf);background:linear-gradient(150deg,var(--mkbg),var(--card2))}
.chips i.rz{background:var(--mkbg);color:var(--mk);font-weight:600;box-shadow:inset 0 0 0 1px var(--mkf)}
.gh .rz{font-style:normal;font-size:12px;padding:1px 9px;border-radius:7px;background:var(--mkbg);color:var(--mk);font-weight:600;margin-left:6px}
.xp{border-radius:18px;padding:14px;margin:12px 0;background:linear-gradient(150deg,var(--card),var(--card2));border:1px solid var(--line);box-shadow:0 12px 26px -10px var(--sh),inset 0 1px 0 var(--hi)}
.xp b{font-weight:600}.xp .xr{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.xp input,.xp select{flex:1 1 180px;min-width:0;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.xp button{width:100%;padding:11px;border:0;border-radius:99px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(160deg,#58dbaa,#1f9e72);box-shadow:0 8px 18px -4px rgba(30,170,120,.65),inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer}

<script src="config.js"></script>
<script>
let READY=false,CAN=false,ADMIN=false;
const R=[],$=s=>document.querySelector(s),M=$('#m');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=encodeURIComponent,ZN=['Zone1','Zone2','Network-Telecom'],UL=['1A','1B','1C','1D','2A','2B','2C','2D'];
const NT='Network-Telecom';
const gOf=r=>r.zone==NT?(r.id.startsWith('TEL')?'Telecom':'Network'):r.c,EMP='Rack ว่าง';
const ordG=(a,b)=>(a==EMP)-(b==EMP)||(a=='Network'||a=='Telecom')-(b=='Network'||b=='Telecom');
const byId={};
const C={};
const U={};
/* สร้าง/สร้างใหม่ทุก index จากข้อมูลดิบ (เรียกทุกครั้งที่โหลดข้อมูลจาก API) — แก้ object เดิมแทนการสร้างใหม่ เพื่อให้ฟังก์ชันอื่นอ้างถึงได้ต่อเนื่อง */
function build(raw){
 R.length=0;raw.forEach(r=>R.push(r));
 R.forEach(r=>{if(r.c.startsWith('พื้นที่'))r.c='(พื้นที่กั้นกรง)';if(r.c=='(ไม่ระบุ)')r.c='Rack ว่าง';if(r.zone!=NT&&/^pa(tc)?h/i.test(r.c))r.c='Patch Network';r.risk=r.s>0;r.no=r.dv.reduce((a,v)=>a+(v[3]=='ไม่ ON'?1:0),0)});
 Object.keys(byId).forEach(k=>delete byId[k]);R.forEach(r=>{byId[r.id]=r});
 Object.keys(C).forEach(k=>delete C[k]);R.forEach(r=>{if(r.zone==NT||(r.st=='cage'&&r.c[0]=='('))return;(C[r.c]??=[]).push(r)});
 UL.forEach(u=>{U[u]={r:new Set,s:0,d:0}});
 R.forEach(r=>r.dv.forEach(v=>{if(v[3]=='Single'||v[3]=='Dual')v[4].split(',').forEach(u=>{if(U[u]){U[u].r.add(r.id);v[3]=='Single'?U[u].s++:U[u].d++}})}));
}
const STL={use:r=>r.s>0?(r.d>0?'เสี่ยง':'Single ล้วน'):'Dual ล้วน',empty:()=>'ว่าง',cage:r=>r.cg=='buy'?'เช่าเพิ่ม':'กั้นกรง',off:()=>'วางเครื่อง ไม่ ON'};
const imp=r=>r.st!='use'?'':r.s>0?(r.d>0?'y':'r'):r.d>0?'g':'nu';
const stCls=r=>imp(r)=='nu'?'':imp(r);
const tile=r=>`<a class="t ${r.st=='use'?imp(r):r.st}${r.n==19?' p':''}${r.cg=='buy'?' by':''}" href="#rack/${enc(r.id)}" title="${esc(r.name+' '+r.c)}">${r.n}</a>`;
const card=r=>`<a class="rc ${imp(r)}" href="#rack/${enc(r.id)}"><div class="rt"><b>${esc(r.name)}</b><span class="pill ${stCls(r)}">${STL[r.st](r)}</span></div><div class="sub">${esc(r.c)} / ${r.zone} ${esc(r.row)}</div><div class="chips">${r.s?`<i class="cs">Single ${r.s}</i>`:''}${r.d?`<i class="cd">Dual ${r.d}</i>`:''}${r.ups.map(u=>`<i>UPS-${u}</i>`).join('')}${r.st=='off'&&r.u?`<i>U ใช้ ${r.u}</i>`:''}</div></a>`;
const SH={use:r=>r.s>0?(r.d>0?'เสี่ยง':'Single'):'Dual',empty:()=>'ว่าง',cage:r=>r.cg=='buy'?'เช่าเพิ่ม':'กั้นกรง',off:()=>'ไม่ ON'};
const blk=r=>`<a class="rb ${imp(r)}" href="#rack/${enc(r.id)}"><div class="rt"><b>${esc(r.name)}</b><span class="pill ${stCls(r)}">${SH[r.st](r)}</span></div><div class="chips">${r.s?`<i class="cs">S ${r.s}</i>`:''}${r.d?`<i class="cd">D ${r.d}</i>`:''}${r.ups.length?`<i>${r.ups.join(' ')}</i>`:''}</div></a>`;
const rowGroups=l=>{const k=[...new Set(l.map(r=>r.ro+'|'+r.zone+' '+r.row))].sort();return k.map(x=>{const [ro,t]=x.split('|'),g=l.filter(r=>r.ro==ro&&r.zone+' '+r.row==t).sort((a,b)=>a.n-b.n);return `<div class="gh"><b>${esc(t)}</b><span class="sub">เสี่ยง ${g.filter(r=>r.risk).length}/${g.length} Rack</span></div><div class="g2">${g.map(blk).join('')}</div>`}).join('')};
const cards=l=>l.length?l.map(card).join(''):'<p class="empty">ไม่พบข้อมูล</p>';
const isDev=v=>v[3]=='Single'||v[3]=='Dual';
const NOSRC='ไม่ได้เสียบ Source Power',upsTxt=v=>isDev(v)?(v[4]?'UPS-'+v[4]:NOSRC):'';
const devSub=v=>`U${v[1]==v[0]?v[0]:v[1]+'-'+v[0]} / ${v[3]}${upsTxt(v)?' / '+upsTxt(v):''}`;
let rf={c:'',u:''},ef='';

const XP=()=>`<div class="xp"><b>ส่งรายงาน Excel ไป LINE</b><div class="sub">รายงานเมื่อ UPS เสีย: ลูกค้า → Rack → จำนวนเครื่อง Single/Dual เรียงตามผลกระทบ พร้อมสรุป</div><div class="xr"><select id="xu"><option value="ALL">ทุก UPS</option>${UL.map(u=>`<option value="${u}">UPS-${u}</option>`).join('')}</select></div><button id="xl" class="alt">ส่งไป LINE</button><p id="xs" class="sub"></p></div>`;
/* ================= Export Excel (UPS failure impact) ================= */
const XT=[{bg:'FDE2E4',fg:'B42318'},{bg:'FFF3C4',fg:'8A6100'},{bg:'D9F5E8',fg:'0B6B47'}],CN=['Single ล้วน','เสี่ยง (Dual+Single)','Dual ล้วน'];
const rkc=r=>r.s>0?(r.d>0?1:0):2;
const fillX=c=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+c}});
const thin={style:'thin',color:{argb:'FFC9D2E6'}},BDX={top:thin,left:thin,bottom:thin,right:thin};
function put(ws,r,c1,c2,v,o={}){if(c2>c1)ws.mergeCells(r,c1,r,c2);
 for(let c=c1;c<=c2;c++){const x=ws.getCell(r,c);if(o.bg)x.fill=fillX(o.bg);if(o.bd)x.border=BDX}
 const x=ws.getCell(r,c1);x.value=v;x.font={name:'Tahoma',size:o.sz||11,bold:!!o.b,color:{argb:'FF'+(o.fg||'14213D')}};
 x.alignment={vertical:'middle',horizontal:o.h||'left',wrapText:!!o.w};if(o.ht)ws.getRow(r).height=o.ht}
const sec=(ws,r,n,t)=>put(ws,r,1,n,t,{bg:'DCE6FF',fg:'1F3A8A',b:1,sz:13,ht:26});
function upsData(u){return [...U[u].r].map(i=>byId[i]).map(r=>{let sU=0,dU=0;
 r.dv.forEach(v=>{if(isDev(v)&&v[4].split(',').includes(u))v[3]=='Single'?sU++:dU++});
 const eff=sU>0?(sU==r.s&&r.d==0?'ไฟดับทั้ง Rack':'ดับบางส่วน (เครื่อง Single)'):'ไม่ดับ (Dual มีไฟสำรอง)';
 return{r,k:rkc(r),sU,dU,eff}})}
const nk=(l,k)=>l.filter(x=>x.k==k).length;
const cord=(p,q)=>ordG(p[0],q[0])||nk(q[1],0)-nk(p[1],0)||nk(q[1],1)-nk(p[1],1)||q[1].length-p[1].length||(p[0]<q[0]?-1:1);
const prs=(a,b)=>a.k-b.k||b.sU-a.sU||a.r.ro-b.r.ro||a.r.n-b.r.n;
