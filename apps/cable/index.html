<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระยะลากสาย Data Center</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);--fs:'Prompt','Noto Sans Thai',system-ui,sans-serif;--bg:#eaf3d9;--card:#fff;--card2:#f1f7e4;--tx:#10260f;--mut:#5f7a57;--line:#cfe0b3;--bd:#cfe0b3;--lime:#bfe92f;--lime2:#9bd01f;--ink:#0c2210;--rack:#cfe0b8;--sel:#2f6a14;--onsel:#fff;--tray:#2d3b2a;--path:#e8512d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1d0e;--card:#112a17;--card2:#17361f;--tx:#eef8e2;--mut:#8da98a;--line:#24472b;--bd:#24472b;--lime:#c9f23c;--lime2:#a8dd2b;--ink:#0c2210;--rack:#27492f;--sel:#c9f23c;--onsel:#0c2210;--tray:#d6e8cf;--path:#ff7a59}}
:root[data-theme="dark"]{--bg:#0a1d0e;--card:#112a17;--card2:#17361f;--tx:#eef8e2;--mut:#8da98a;--line:#24472b;--bd:#24472b;--lime:#c9f23c;--lime2:#a8dd2b;--ink:#0c2210;--rack:#27492f;--sel:#c9f23c;--onsel:#0c2210;--tray:#d6e8cf;--path:#ff7a59}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font:15px/1.5 var(--fs);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.app{max-width:560px;margin:0 auto}
.hero{background:linear-gradient(160deg,var(--lime),var(--lime2));color:var(--ink);padding:14px 16px 20px;border-radius:0 0 34px 34px;box-shadow:0 20px 40px -24px rgba(0,0,0,.5)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mark,.ib{width:40px;height:40px;border-radius:14px;background:var(--ink);color:var(--lime);display:grid;place-items:center;border:0}
.ib{border-radius:50%;cursor:pointer;transition:transform .3s}.ib:active{transform:scale(.9) rotate(30deg)}
h1{margin:0;font-size:19px;font-weight:700;line-height:1.15;flex:1}h1 small{display:block;font-size:11px;font-weight:500;opacity:.65}
.inbox{background:rgba(255,255,255,.5);border-radius:24px;padding:10px}
.f{display:grid;gap:8px}
.f>div:not(.keep),.sub,.hint,.zb span,#route,#bd,#rec{display:none!important}
.f>.keep{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.72);border-radius:16px;padding:8px 14px;transition:box-shadow .2s}
.f>.keep:focus-within{box-shadow:0 0 0 2px var(--ink)}
.f label{margin:0;width:34px;font-size:12px;font-weight:600;color:var(--ink);opacity:.6}
.f input{width:100%;min-width:0;border:0;outline:0;background:transparent;padding:6px 0;font:600 22px var(--fs);letter-spacing:.04em;color:var(--ink)}
.f input::placeholder{color:var(--ink);opacity:.3}
.amt{padding:22px 20px 6px}.lab{font-size:13px;color:var(--mut)}
.big{font-size:64px;font-weight:700;line-height:1.05;letter-spacing:-.02em;color:var(--tx)}
.big .dec{color:var(--lime);font-size:.62em}.big .u{font-size:.32em;color:var(--mut);margin-left:6px;font-weight:500}
.lim{margin-top:14px}.lim .tr{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.lim i{display:block;height:100%;width:0;background:var(--lime);border-radius:6px;transition:width .6s cubic-bezier(.2,.8,.2,1),background .3s}
.lim.over i{background:#ff6b4a}.lim .lr{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
#wn{margin-top:10px;padding:8px 12px;border-radius:12px;background:rgba(255,107,74,.16);color:#ff8a6a;font-size:13px}#wn:empty{display:none}
.chips{padding:12px 16px 4px}.chips .keep{display:block}.chips label{display:none}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 15px var(--fs);cursor:pointer;transition:all .25s}
.seg button.on{background:var(--lime);color:var(--ink);border-color:var(--lime);transform:translateY(-1px);box-shadow:0 8px 20px -10px var(--lime)}
.plan{margin:12px 6px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px 6px}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:600}
.zb{display:flex;gap:8px;margin:0}.zb button{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:18px;cursor:pointer}
.sv{overflow-x:auto;border-radius:18px;background:var(--bg);-webkit-overflow-scrolling:touch}
svg{display:block;width:100%;height:auto}svg text{pointer-events:none;user-select:none}
.rk{cursor:pointer}.rk:hover rect{stroke:var(--lime);stroke-width:1.5}
svg rect[fill="var(--sel)"]+text{fill:var(--onsel)}
svg polyline[stroke="var(--path)"]{stroke-dasharray:9 7;animation:flow .8s linear infinite;filter:drop-shadow(0 0 3px var(--path))}
@keyframes flow{to{stroke-dashoffset:-32}}@keyframes rise{from{opacity:0;transform:translateY(16px)}}@keyframes pulse{from{opacity:.7;transform:scale(.9)}to{opacity:0;transform:scale(1.4)}}
.hero,.amt,.chips,.plan{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}.amt{animation-delay:.08s}.chips{animation-delay:.16s}.plan{animation-delay:.24s}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);height:76px;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--lime),var(--lime2));border-radius:30px 30px 0 0;display:flex;align-items:flex-end;justify-content:space-around;z-index:5;box-shadow:0 -10px 30px -12px rgba(0,0,0,.55)}
.nav button{background:none;border:0;color:var(--ink);font:600 11px var(--fs);display:grid;justify-items:center;gap:2px;padding:6px 20px;cursor:pointer;opacity:.8;transition:transform .2s}.nav button:active{transform:scale(.92)}
.nav .mid{position:relative;align-self:flex-start;margin-top:-28px;width:66px;height:66px;padding:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#78a524,#233b0f);color:var(--lime);opacity:1;border:4px solid var(--bg);place-items:center}
.nav .mid::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--lime);animation:pulse 2.4s ease-out infinite}
.mid svg{transition:transform .5s cubic-bezier(.2,.8,.2,1)}.mid.rot svg{transform:rotate(180deg)}
.toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,20px);background:var(--lime);color:var(--ink);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:380px){.big{font-size:52px}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="bar"><span class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c4 0 4-10 9-10s5 10 9 10"/><circle cx="3" cy="17" r="1"/><circle cx="21" cy="17" r="1"/></svg></span><h1>ระยะลากสาย<small id="sub">Data Center · Phase 1 · Zone 01–02</small></h1><button class="ib" id="tg" type="button" aria-label="สลับธีม"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button></div>
<div class="inbox"><div class="f">
<div class="keep"><label>จาก</label><input id="a" value="02-01-05"></div>
<div class="keep"><label>ถึง</label><input id="b" value="02-12-15"></div>
<div class="keep"><label>ชนิดสาย</label><select id="t"><option value="utp">UTP</option><option value="fib">Fiber</option></select></div>
<div><label>🔒 UTP Net-A → Colo (m)</label><input id="cA" type="number" value="7.2" readonly style="opacity:.75;cursor:not-allowed"></div>
<div><label>🔒 UTP Net-B → Colo (m)</label><input id="cB" type="number" value="6.6" readonly style="opacity:.75;cursor:not-allowed"></div>
<div><label>รางดำจาก Net-A ต่อที่ (M/C+Row)</label><input id="eA" value="M1"></div>
<div><label>รางดำจาก Net-B ต่อที่ (M/C+Row)</label><input id="eB" value="M12"></div>
<div><label>🔒 Fiber Net-A → Colo (m)</label><input id="fA" type="number" value="6.4" readonly style="opacity:.75;cursor:not-allowed"></div>
<div><label>🔒 Fiber Net-B → Colo (m)</label><input id="fB" type="number" value="2.4" readonly style="opacity:.75;cursor:not-allowed"></div>
<div><label>สายจากหัว Rack รวม 2 ฝั่ง (m)</label><input id="ir" type="number" value="6" step="0.5"></div>
<div><label>ขนาดช่องในแปลน (m)</label><input id="pi" type="number" value="0.6" step="0.05"></div>
</div></div></header>
<section class="amt"><div class="lab">ระยะสายรวม</div><div class="big" id="tot">–</div>
<div class="lim" id="lim"><div class="tr"><i id="limf"></i></div><div class="lr"><span>0</span><span>90 m</span></div></div>
<div id="wn"></div><div id="rec"></div><div id="route"></div><table id="bd"></table></section>
<section class="chips" id="chips"></section>
<section class="plan"><div class="ph"><span>แปลน</span><div class="zb"><button id="zo" type="button">−</button><button id="zi" type="button">+</button><span>ซูม · เลื่อนซ้าย–ขวาเพื่อดูแปลน · แตะ Rack เพื่อเลือก</span></div></div><div class="sv"><svg id="map" viewBox="0 0 700 420"></svg></div></section>
<nav class="nav"><button id="nclr" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>ล้าง</span></button><button id="nsw" class="mid" type="button" aria-label="สลับ จาก/ถึง"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M7 18l-3-3M7 18l3-3M17 20V6M17 6l-3 3M17 6l3 3"/></svg></button><button id="ncp" type="button"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg><span>คัดลอก</span></button></nav>
<div class="toast" id="toast"></div></div>
<script>
const ROWS=12,RACKS=19,RW=0.6,S=30,OX=100,CW=6,OY=470,CELLS=[0,4,8,13,17,22,26,31,35,40,44,49],TC=[0,2.5,8.5,11.5,17.5,20.5,26.5,29.5,35.5,38.5,44.5,47.5];
const LINKS1=[[1,2,18],[2,3,18],[3,4,10],[3,4,2],[5,6,13],[5,6,7],[6,7,13],[6,7,7],[7,8,13],[7,8,7],[9,10,10],[10,11,10],[11,12,10]],CROSS1=[4,5,6,7,8];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
let pick=0;
function parse(s){const T=/^\s*(tele|net)-?([ab])(?:-(\d{1,2}))?\s*$/i.exec(s);if(T){const n=T[1][0].toUpperCase()+T[2].toUpperCase(),k=+T[3]||0,mx=n[0]==='N'?10:9;if(k>mx)return{e:(n[0]==='N'?'Net':'Tele')+'-'+n[1]+' มี Rack 1–'+mx};return{tele:n,rk:k}}const m=/^\s*(\d{1,2})-(\d{1,2})-(\d{1,2})\s*$/.exec(s);if(!m)return{e:'รูปแบบไม่ถูกต้อง (ตัวอย่าง 02-03-10)'};
 const z=+m[1],r=+m[2],k=+m[3];
 if(z!==1&&z!==2)return{e:'ไม่มี Zone '+pad(z)};
 if(r<1||r>ROWS)return{e:'Row ต้องอยู่ที่ 1–'+ROWS};
 if(k<1||k>(z===1?18:RACKS))return{e:'Rack ต้องอยู่ที่ 1–'+(z===1?18:RACKS)};
 return{z,r,k}}
function dijk(s,t,P,W){// nodes: 'M'+i (ฝั่ง Rack1), 'C'+i (ฝั่ง Rack19)
 const nodes=[];for(let i=1;i<=ROWS;i++)nodes.push('M'+i,'C'+i);
 const adj={};const L=(a,b,w)=>{(adj[a]=adj[a]||[]).push([b,w]);(adj[b]=adj[b]||[]).push([a,w])};
 for(let i=1;i<=ROWS;i++){if(!W.fib)L('M'+i,'C'+i,(RACKS+0.5)*RW);if(i<ROWS){const w=(TC[i]-TC[i-1])*P;L(W.fib?'C'+i:'M'+i,W.fib?'C'+(i+1):'M'+(i+1),w)}}
 if(W.fib){L('NA','YL',W.fA+21*RW);L('YL','C1',1.7*P);L('NB','YR',W.fB+21*RW);L('YR','C'+ROWS,2*P);nodes.push('YL','YR')}else{L('NA',W.eA,W.cA);L('NB',W.eB,W.cB)}nodes.push('NA','NB');const d={},pr={},Q=new Set(nodes);nodes.forEach(n=>d[n]=Infinity);d[s]=0;
 while(Q.size){let u=null;Q.forEach(n=>{if(u===null||d[n]<d[u])u=n});Q.delete(u);if(u===t)break;
  (adj[u]||[]).forEach(([v,w])=>{if(d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}})}
 const p=[t];while(p[0]!==s)p.unshift(pr[p[0]]);return{len:d[t],path:p}}
const STD=[1,2,3,5,7,10,15,20,30,50,75,100,150,200];
function ent(id,d){const m=/^([MC])(\d{1,2})$/.exec(($(id).value||'').trim().toUpperCase());return m&&+m[2]>=1&&+m[2]<=ROWS?m[1]+(+m[2]):d}
function fd(o){const k=o.rk,b=o.tele[1]==='B';return 1.6+(o.tele[0]==='T'?(b?16:15)+k:b?(k<=7?Math.abs(k-6):k-5):(k===10?6:Math.abs(k-5)))}
function gd(E,s,t){const adj={};E.forEach(([a,b,w])=>{(adj[a]=adj[a]||[]).push([b,w]);(adj[b]=adj[b]||[]).push([a,w])});const d={[s]:0},pr={},Q=new Set(Object.keys(adj));Q.add(s);
 while(Q.size){let u=null;Q.forEach(n=>{if(d[n]!==undefined&&(u===null||d[n]<d[u]))u=n});if(u===null)break;Q.delete(u);if(u===t)break;(adj[u]||[]).forEach(([v,w])=>{if(d[v]===undefined||d[u]+w<d[v]){d[v]=d[u]+w;pr[v]=u}})}
 if(d[t]===undefined)return{len:Infinity,path:[s,t]};const p=[t];while(p[0]!==s)p.unshift(pr[p[0]]);return{len:d[t],path:p}}
function z1g(P){const E=[],lv={};for(let r=1;r<=ROWS;r++)lv[r]=new Set([19]);LINKS1.forEach(([a,b,l])=>{lv[a].add(l);lv[b].add(l)});CROSS1.forEach(r=>lv[r].add(0));
 for(let r=1;r<=ROWS;r++){const q=[...lv[r]].sort((x,y)=>x-y);for(let i=0;i<q.length-1;i++)E.push(['B'+r+'_'+q[i],'B'+r+'_'+q[i+1],(q[i+1]-q[i])*RW]);E.push(['B'+r+'_19','Y'+r,RW]);if(r<ROWS)E.push(['Y'+r,'Y'+(r+1),(TC[r]-TC[r-1])*P])}
 LINKS1.forEach(([a,b,l])=>E.push(['B'+a+'_'+l,'B'+b+'_'+l,Math.abs(TC[b-1]-TC[a-1])*P]));
 for(let i=0;i<CROSS1.length-1;i++){const a=CROSS1[i],b=CROSS1[i+1];E.push(['B'+a+'_0','B'+b+'_0',(TC[b-1]-TC[a-1])*P])}
 return{E,lv}}
function z1rk(g,id,r,k){g.lv[r].forEach(l=>g.E.push([id,'B'+r+'_'+l,Math.abs(l-k)*RW]));g.E.push([id,'Y'+r,(19-k)*RW])}
function calc1(){
 const P=+$('pi').value||0.6,X=i=>OX+CELLS[i-1]*CW,W2=X(ROWS)+OX,YUc=OY-34,XV=68,Yr=k=>OY+(k-0.5)*RW*S,Ye=e=>e==='M'?OY:OY+RACKS*RW*S,mid=OY+RACKS*RW*S/2-9;
 const A=parse($('a').value),B=parse($('b').value);let s='';$('map').setAttribute('viewBox','0 0 '+W2+' 900');
 for(let i=1;i<=ROWS;i++){s+=`<text x="${X(i)}" y="${OY-24}" font-size="10" text-anchor="middle" fill="var(--mut)">R${i}</text>`;
  for(let k=1;k<=RACKS;k++){const sel=(A.z===2&&A.r===i&&A.k===k)||(B.z===2&&B.r===i&&B.k===k);
   s+=`<g class="rk" data-r="${i}" data-k="${k}"><rect x="${X(i)-10}" y="${OY+(k-1)*RW*S+0.5}" width="20" height="${RW*S-1}" fill="${sel?'var(--sel)':'var(--rack)'}" stroke="var(--bd)" stroke-width=".5"/><text x="${X(i)}" y="${OY+(k-1)*RW*S+RW*S/2+3}" font-size="9.5" text-anchor="middle" fill="${sel?'#fff':'var(--tx)'}">${k}</text></g>`}
  s+=`<line x1="${X(i)}" y1="${OY}" x2="${X(i)}" y2="${Ye('C')}" stroke="var(--tray)" stroke-width="2" opacity=".45"/>`}
 s+=`<line x1="${X(1)}" y1="${OY}" x2="${X(ROWS)}" y2="${OY}" stroke="var(--tray)" stroke-width="3"/>`;
 {const y1=l=>l===0?OY-72:OY-72-(l-0.5)*18,yt=OY-414;
 for(let i=1;i<=ROWS;i++){
  s+=`<line x1="${X(i)}" y1="${y1(0)}" x2="${X(i)}" y2="${y1(19)}" stroke="var(--tray)" stroke-width="2" opacity=".45"/><text x="${X(i)}" y="${yt-8}" font-size="10" text-anchor="middle" fill="var(--mut)">R${i}</text>`;
  for(let k=1;k<=18;k++){const sel=[A,B].some(o=>o.z===1&&o.r===i&&o.k===k),yy=OY-72-k*18;
   s+=`<g class="rk" data-z="1" data-r="${i}" data-k="${k}"><rect x="${X(i)-10}" y="${yy+0.5}" width="20" height="17" fill="${sel?'var(--sel)':'var(--rack)'}" stroke="var(--bd)" stroke-width=".5"/><text x="${X(i)}" y="${yy+12}" font-size="9.5" text-anchor="middle" fill="${sel?'#fff':'var(--tx)'}">${k}</text></g>`}}
 s+=`<line x1="${X(4)}" y1="${y1(0)}" x2="${X(8)}" y2="${y1(0)}" stroke="var(--tray)" stroke-width="3"/><line x1="${X(8)}" y1="${y1(0)}" x2="${X(8)}" y2="${OY}" stroke="var(--tray)" stroke-width="3"/><polyline points="${X(1)-14},${OY-14} ${X(1)-14},${yt} ${X(ROWS)+14},${yt} ${X(ROWS)+14},${OY-14}" fill="none" stroke="#eab308" stroke-width="4" opacity=".55"/><line x1="${X(8)+6}" y1="${yt}" x2="${X(8)+6}" y2="${OY-14}" stroke="#eab308" stroke-width="3" opacity=".7" stroke-dasharray="4 3"/>`;
 LINKS1.forEach(([a,b,l])=>{s+=`<line x1="${X(a)}" y1="${y1(l)}" x2="${X(b)}" y2="${y1(l)}" stroke="var(--tray)" stroke-width="3"/>`});
 s+=`<text x="${X(1)}" y="${yt-26}" font-size="12" fill="var(--mut)">Zone 01</text><text x="${X(1)}" y="${Ye('C')+36}" font-size="12" fill="var(--mut)">Zone 02</text>`}
 s+=`<text x="${OX-12}" text-anchor="end" y="${OY+4}" font-size="9" fill="var(--mut)"></text><text x="${OX-12}" text-anchor="end" y="${Ye('C')+4}" font-size="9" fill="var(--mut)"></text><text x="${X(ROWS)/2+OX/2}" y="${Ye('C')+26}" font-size="11" text-anchor="middle" fill="var(--mut)">CRAH-B</text>`;
 ['A','B'].forEach(q=>{const L=q==='A',m=x=>L?x:W2-x,x0=L?62:W2-142,x1=L?142:W2-62,xa=m(52),xb=L?80:W2-80,xv=m(XV),xl=L?X(1):X(ROWS),tr=L?$('cA').value:$('cB').value,fr=L?$('fA').value:$('fB').value;
 s+=`<polyline points="${m(37)},${OY+352} ${m(37)},${YUc} ${xa},${YUc}" fill="none" stroke="#9ca3af" stroke-width="4" opacity=".85"/><polyline points="${m(44)},${OY+352} ${m(44)},${OY-14} ${xa},${OY-14}" fill="none" stroke="#eab308" stroke-width="4" opacity=".85"/>`;

  const from=cur,t0=performance.now(),st=n=>{const k=Math.min(1,(n-t0)/500),e=1-Math.pow(1-k,3);show(from+(to-from)*e);if(k<1)raf=requestAnimationFrame(st);else{cur=to;limit(to)}};raf=requestAnimationFrame(st)}).observe(tot,{childList:true,characterData:true,subtree:true});
 const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('show'),1500)};
 $('nsw').onclick=function(){const x=$('a').value;$('a').value=$('b').value;$('b').value=x;this.classList.toggle('rot');calc();if(navigator.vibrate)navigator.vibrate(12)};
 $('nclr').onclick=()=>{$('a').value='';$('b').value='';calc();$('a').focus()};
 $('ncp').onclick=()=>{const x=$('a').value.toUpperCase()+' → '+$('b').value.toUpperCase()+' ('+(t.value==='fib'?'Fiber':'UTP')+') '+last.toFixed(dec)+' m';
  (navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast('คัดลอกแล้ว'),()=>toast(x))};
 $('tg').onclick=()=>{R.dataset.theme=R.dataset.theme==='light'?'dark':'light'};
 $('a').placeholder='02-03-10';$('b').placeholder='01-08-10';$('a').autocomplete=$('b').autocomplete='off'})();

const ph=document.createElement('div');ph.className='seg';ph.style.marginBottom='8px';
const phs=()=>ph.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===PH));
function setPh(v){PH=v;pick=0;$('a').value='02-01-05';$('b').value=v===2?'01-12-15':'02-12-15';$('ir').value=v===2?8:6;
 $('ir').previousElementSibling.textContent=v===2?'ระยะขึ้น–ลง Rack รวม 2 ฝั่ง (m)':'สายจากหัว Rack รวม 2 ฝั่ง (m)';
 $('sub').textContent='Data Center · Phase '+v+' · Zone 01–02';phs();zm(0);calc()}
[1,2].forEach(v=>{const b=document.createElement('button');b.type='button';b.textContent='Phase '+v;b.dataset.v=v;b.onclick=()=>setPh(v);ph.appendChild(b)});
$('chips').insertBefore(ph,$('chips').firstChild);phs();
calc();
</script>
